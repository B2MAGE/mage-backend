name: mage-portfolio-demo
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mage_demo
      POSTGRES_USER: mage_demo
      POSTGRES_PASSWORD: ${MAGE_DEMO_PASSWORD:?Set MAGE_DEMO_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mage_demo -d mage_demo]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: mage/minio-community:2025-10-15-local
    build: ../../docker/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mage_demo
      MINIO_ROOT_PASSWORD: ${MAGE_DEMO_PASSWORD:?Set MAGE_DEMO_PASSWORD}
    ports: ['127.0.0.1:19000:9000', '127.0.0.1:19001:9001']
    volumes: [thumbnails:/data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 30
  storage-init:
    image: mage/minio-community:2025-10-15-local
    pull_policy: never
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MAGE_DEMO_PASSWORD: ${MAGE_DEMO_PASSWORD:?Set MAGE_DEMO_PASSWORD}
    entrypoint: [/bin/sh, -c]
    command:
      - 'mc alias set demo http://minio:9000 mage_demo "$$MAGE_DEMO_PASSWORD" && mc mb --ignore-existing demo/mage-demo-thumbnails && mc anonymous set download demo/mage-demo-thumbnails'
  backend:
    build: ../..
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    ports: ['127.0.0.1:18080:8080']
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mage_demo
      SPRING_DATASOURCE_USERNAME: mage_demo
      SPRING_DATASOURCE_PASSWORD: ${MAGE_DEMO_PASSWORD:?Set MAGE_DEMO_PASSWORD}
      MAGE_AUTH_GOOGLE_CLIENT_IDS: demo-disabled.apps.googleusercontent.com
      MAGE_THUMBNAIL_PROVIDER: minio
      MAGE_THUMBNAIL_REGION: us-east-1
      MAGE_THUMBNAIL_BUCKET: mage-demo-thumbnails
      MAGE_THUMBNAIL_KEY_PREFIX: scenes
      MAGE_THUMBNAIL_ENDPOINT: http://minio:9000
      MAGE_THUMBNAIL_PRESIGN_ENDPOINT: http://127.0.0.1:19000
      MAGE_THUMBNAIL_ACCESS_KEY_ID: mage_demo
      MAGE_THUMBNAIL_SECRET_ACCESS_KEY: ${MAGE_DEMO_PASSWORD:?Set MAGE_DEMO_PASSWORD}
      MAGE_THUMBNAIL_PATH_STYLE_ACCESS: 'true'
      MAGE_THUMBNAIL_PUBLIC_BASE_URL: http://127.0.0.1:19000/mage-demo-thumbnails
      MAGE_PASSWORD_RESET_DELIVERY: log
volumes:
  database:
  thumbnails:
